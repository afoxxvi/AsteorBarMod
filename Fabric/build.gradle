plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven { url "https://cursemaven.com" }
    maven { url "https://jitpack.io" }
    maven { url 'https://maven.ladysnake.org/releases' }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    compileOnly project(":Common")
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    api("maven.modrinth:cloth-config:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    include "maven.modrinth:cloth-config:${project.cloth_config_version}"
    api "com.terraformersmc:modmenu:${project.mod_menu_version}"
    if (tough_as_nails_version_fabric != "0") {
        implementation "curse.maven:tough-as-nails-246391:${tough_as_nails_version_fabric}"
    }
    if (dehydration_version_fabric != "0") {
        implementation "curse.maven:dehydration-410830:${dehydration_version_fabric}"
    }
    if (appleskin_version_fabric != "0") {
        implementation "curse.maven:appleskin-248787:${appleskin_version_fabric}"
    }
    if (origins_apoli_version_fabric != "0") {
        implementation("com.github.apace100:apoli:${origins_apoli_version_fabric}") {
            exclude(group: "org.quiltmc.parsers")
            exclude(group: "maven.modrinth")
            exclude(group: "com.jamieswhiteshirt")
        }
    }
    if (thermoo_version_fabric != "0") {
        implementation "maven.modrinth:thermoo:${thermoo_version_id_fabric}"
    }
}

compileJava {
    source(project(":Common").sourceSets.main.allSource)
}

processResources {
    from project(":Common").sourceSets.main.resources
    inputs.property "version", project.mod_version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "minecraft_version_range", project.fabric_minecraft_version_range
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.mod_version,
                "minecraft_version": project.minecraft_version,
                "minecraft_version_range": project.fabric_minecraft_version_range,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

base {
    archivesName = "${project.mod_id}-fabric-${project.minecraft_version}-${project.mod_version}"
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

// configure the maven publication
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}

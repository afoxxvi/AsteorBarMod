plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

group = mod_group_id
version = mod_version

base {
    archivesName = "$mod_id-forge-$minecraft_version-$mod_version"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets.main.resources { srcDir 'src/generated/resources' }

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
            args "-mixin.config=${mod_id}.mixins.json"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        register('client')
        register('server') {
            args '--nogui'
        }
        register('gameTestServer')
        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')
            args '--mod', mod_id, '--all', '--output', layout.projectDirectory.dir('src/generated/resources'), '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
    maven { url = 'https://cursemaven.com' }
}

dependencies {
    compileOnly project(':Common')
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    annotationProcessor "net.minecraftforge:eventbus-validator:${eventbus_validator_version}"

    if (tough_as_nails_version_forge != '0') {
        compileOnly "curse.maven:tough-as-nails-246391:${tough_as_nails_version_forge}"
    }
    if (thirst_was_taken_version_forge != '0') {
        compileOnly "curse.maven:thirst-was-taken-679270:${thirst_was_taken_version_forge}"
    }
    if (mekanism_version_forge != '0') {
        compileOnly "curse.maven:mekanism-268560:${mekanism_version_forge}"
    }
    if (parcool_version_forge != '0') {
        compileOnly "curse.maven:parcool-482378:${parcool_version_forge}"
    }
    if (irons_spellbooks_version_forge != '0') {
        compileOnly "curse.maven:irons-spells-n-spellbooks-855414:${irons_spellbooks_version_forge}"
    }
    if (feathers_version_forge != '0') {
        compileOnly "curse.maven:feathers-699933:${feathers_version_forge}"
    }
    if (appleskin_version_forge != '0') {
        compileOnly "curse.maven:appleskin-248787:${appleskin_version_forge}"
    }
    if (superiorshields_version_forge != '0') {
        compileOnly "curse.maven:superior-shields-311785:${superiorshields_version_forge}"
    }
    if (vampirism_version_forge != '0') {
        compileOnly "curse.maven:vampirism-become-a-vampire-233029:${vampirism_version_forge}"
    }
}

compileJava {
    source(project(':Common').sourceSets.main.allSource)
}

processResources {
    from project(':Common').sourceSets.main.resources
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
            pack_format_number: pack_format_number, pack_format_minor: pack_format_minor,
    ]

    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title': mod_id,
                'Specification-Vendor': mod_authors,
                'Specification-Version': '1',
                'Implementation-Title': project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor': mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs': "${mod_id}.mixins.json"
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea.module { downloadJavadoc = downloadSources = true }

sourceSets.each {
    def dir = layout.buildDirectory.dir("sourceSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}

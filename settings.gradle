pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven { url = 'https://maven.neoforged.net/releases' }
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.10.0'
}

rootProject.name = 'AsteorBarMod'
include 'Common'

// Include 'Forge' and 'NeoForge' only on Gradle versions that their plugins support (<9).
// This lets the workspace run with Gradle 9+ for Fabric while keeping the other subprojects
// available when using an older Gradle wrapper.
def gradleMajor = gradle.gradleVersion.tokenize('.')[0].toInteger()
if (gradleMajor < 9) {
    include 'Forge'
    include 'NeoForge'
} else {
    include 'Fabric'
}
